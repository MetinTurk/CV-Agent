<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Co-pilot Extension Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
              circle at 1px 1px,
              rgba(255, 255, 255, 0.25) 1px,
              transparent 0
            )
            0 0 / 12px 12px,
          #171a23;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .browser-canvas {
        width: min(92vw, 920px);
        height: min(72vh, 620px);
        min-height: 420px;
        display: grid;
        place-items: center;
        border: 2px solid #5966ff;
        border-radius: 8px;
        background: #e6eaef;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      iframe {
        width: 302px;
        height: 262px;
        border: 0;
        border-radius: 8px;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main class="browser-canvas" aria-label="Tarayıcı eklentisi önizlemesi">
      <iframe src="./popup/popup.html" title="Career Co-pilot popup"></iframe>
    </main>
  </body>
</html>
